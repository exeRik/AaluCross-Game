<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AaluCross</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- For reset button -->
    <button class="btn hidden">RESET</button><br>

        <!-- for result -->
     <div class="result"></div>


<!--      for which players turn -->
    <div class=" player1 player--active turn" ><b>TURN: Player1</b> </div>
    <div class="player2 turn" ><b>TURN: Player2</b> </div><br>


    <!-- for playbox -->
    <div class="main">
        <div class="one">
            <div class="space" id="space0"></div>
            <div class="space" id="space1"></div>
            <div class="space" id="space2"></div><br>
        </div>
        <div class="one">
            <div class="space" id="space3"></div>
            <div class="space" id="space4"></div>
            <div class="space" id="space5"></div><br>
        </div>
        <div class="one">
            <div class="space" id="space6"></div>
            <div class="space" id="space7"></div>
            <div class="space" id="space8"></div><br>
        </div>
    </div>


    
    
    <script src="script.js"></script>
</body>
</html>
